<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10141c" />
    <meta name="description" content="Capitol Stock Management — inventory, requisitions, water tracking and reports." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Capitol Stock" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Capitol Stock Management</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/assets/capitol-stock-icon-180.png" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Lato:wght@400;700;900&family=Lora:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Merriweather:wght@400;700;900&family=Nunito+Sans:wght@400;600;700;800&family=Roboto:wght@400;500;700;900&family=Source+Sans+3:wght@400;500;600;700;800&display=swap" />
    <link rel="stylesheet" href="/vendor/bootstrap.min.css" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/vendor/bootstrap.bundle.min.js" defer></script>
  </head>
  <body>
    <main id="app">
      <div class="boot-screen" aria-live="polite">
        <div class="boot-card">
          <img class="boot-logo" src="/assets/capitol-catering-icon.png" alt="" />
          <span class="boot-brand">CAPITOL STOCK MANAGEMENT</span>
          <strong class="boot-status">Connecting securely to your workspace…</strong>
          <div class="startup-progress-track" role="progressbar" aria-label="Loading live Capitol workspace" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div>
          <strong class="startup-progress-value">0%</strong>
          <p class="boot-detail">Loading the latest live workspace and inventory.</p>
        </div>
      </div>
    </main>
    <div id="toast-region" class="toast-region" aria-live="polite" aria-relevant="additions"></div>
    <script src="/app.js" defer></script>
  </body>
</html>
